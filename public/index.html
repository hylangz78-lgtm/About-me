<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lagu gw</title>
<meta name="description" content="Kumpulan lagu favorit gw.">
<meta property="og:title" content="Lagu gw">
<meta property="og:description" content="Kumpulan lagu favorit gw.">
<meta name="theme-color" content="#E6E0FF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6E0FF; --ink:#1A1033; --muted:#5B4F82; --pink:#FF4F8B; --paper:#F6F3FF;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"Instrument Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#150E2B; --ink:#F1ECFF; --muted:#A79BCF; --paper:#211741;}
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:400 1.0625rem/1.55 var(--body);padding:clamp(1.25rem,5vw,4rem)}
main{max-width:46rem;margin:0 auto}
h1{font:800 clamp(3rem,13vw,7.5rem)/.9 var(--display);letter-spacing:-.04em;margin:0 0 1rem;overflow-wrap:anywhere}
.tag{color:var(--muted);font-size:1.125rem;margin:0 0 2.5rem;max-width:32rem}
.player{background:var(--paper);border-radius:1.25rem;padding:1.25rem 1.25rem 1rem;margin-bottom:3rem}
.player h2{font:800 1.5rem/1.1 var(--display);margin:0}
.player p{margin:.25rem 0 1rem;color:var(--muted)}
.player iframe{display:block;width:100%;height:152px;border:0;border-radius:.75rem}
h3{font:500 1rem var(--body);color:var(--muted);margin:0 0 .5rem}
ul{list-style:none;margin:0;padding:0}
li a{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;padding:1rem .25rem;border-bottom:1.5px solid color-mix(in srgb,var(--ink) 18%,transparent);color:inherit;text-decoration:none;transition:padding .18s,background .18s}
li a:hover,li a:focus-visible{background:var(--pink);color:#1A1033;padding-inline:1rem;outline:none;border-radius:.5rem}
.t{font:800 clamp(1.25rem,4.5vw,1.75rem)/1.15 var(--display);letter-spacing:-.02em}
.a{font-size:.95rem;color:var(--muted);text-align:right;flex-shrink:0}
li a:hover .a,li a:focus-visible .a{color:#1A1033}

.cerita{margin:0 0 3rem;max-width:38rem}
.cerita p{margin:0 0 1.1em}
.galeri{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;margin:0 0 3rem}
.galeri figure{margin:0}
.galeri img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:1rem;background:var(--paper)}
.galeri .besar{grid-column:1/-1}
.galeri .besar img{aspect-ratio:16/10}
.galeri figcaption{font-size:.9rem;color:var(--muted);margin-top:.4rem}
footer{margin-top:3rem;color:var(--muted);font-size:.95rem}
a:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1 id="nama">…</h1>
  <p class="tag" id="tagline"></p>
  <section class="player" id="player" hidden>
    <h2 id="fj"></h2>
    <p id="fa"></p>
    <iframe id="fe" allow="encrypted-media" loading="lazy" title="Pemutar lagu"></iframe>
  </section>
  <div class="cerita" id="cerita"></div>
  <div class="galeri" id="galeri"></div>
  <h3>Lagu lainnya</h3>
  <ul id="daftar"></ul>
  <footer id="foot"></footer>
</main>
<script>
fetch("songs.json").then(r=>r.json()).then(d=>{
  document.title = d.nama + " – lagu";
  document.getElementById("nama").textContent = d.nama;
  document.getElementById("tagline").textContent = d.tagline || "";
  const f = d.featured;
  if (f && f.spotify){
    document.getElementById("fj").textContent = f.judul;
    document.getElementById("fa").textContent = f.artis;
    document.getElementById("fe").src = "https://open.spotify.com/embed/track/" + encodeURIComponent(f.spotify);
    document.getElementById("player").hidden = false;
  }
  const ce = document.getElementById("cerita");
  (d.cerita||[]).forEach(t=>{const p=document.createElement("p");p.textContent=t;ce.append(p);});
  const gl = document.getElementById("galeri");
  (d.foto||[]).forEach(x=>{
    const fg=document.createElement("figure"); if(x.besar) fg.className="besar";
    const im=document.createElement("img"); im.src=x.src; im.alt=x.caption||""; im.loading="lazy";
    fg.append(im);
    if(x.caption){const c=document.createElement("figcaption");c.textContent=x.caption;fg.append(c);}
    gl.append(fg);
  });
  const ul = document.getElementById("daftar");
  (d.lagu||[]).forEach(s=>{
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = s.url; a.target = "_blank"; a.rel = "noopener";
    const t = document.createElement("span"); t.className = "t"; t.textContent = s.judul;
    const r = document.createElement("span"); r.className = "a"; r.textContent = s.artis;
    a.append(t, r); li.append(a); ul.append(li);
  });
  if (d.discord) document.getElementById("foot").textContent = "Discord: " + d.discord;
}).catch(()=>{document.getElementById("nama").textContent="Gagal memuat";});
</script>
</body>
</html>
